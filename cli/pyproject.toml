[project]
name = "ctos-cli"
version = "0.1.4"
description = "ching-tech-os 知識庫 / 圖書館遠端存取 CLI"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
ctos = "ctos_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctos_cli"]
